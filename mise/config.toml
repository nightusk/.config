[settings]
disable_backends = ["conda"]
lockfile = true
minimum_release_age = "1mo"

[env]
XDG_CACHE_HOME = "$HOME/.cache"
XDG_CONFIG_HOME = "$HOME/.config"
XDG_DATA_HOME = "$HOME/.local/share"

BUNDLE_USER_CACHE = "$XDG_CACHE_HOME/bundle"
BUNDLE_USER_CONFIG = "$XDG_CONFIG_HOME/bundle/config"
BUNDLE_USER_PLUGIN = "$XDG_DATA_HOME/bundle"
CARGO_HOME = "$XDG_DATA_HOME/cargo"
DUB_HOME = "$XDG_DATA_HOME/dub"
GITLIBS = "$XDG_DATA_HOME/gitlibs"
RUSTUP_HOME = "$XDG_DATA_HOME/rustup"

ZELLIJ_AUTO_ATTACH = "true"

[tools."aqua:fish-shell/fish-shell"]
version = "latest"
os = [ "linux" ]

[tools.bat]
version = "latest"
os = [ "linux" ]

[tools.delta]
version = "latest"
os = [ "linux" ]

[tools.deno]
version = "latest"
os = [ "linux" ]

[tools.eza]
version = "latest"
os = [ "linux" ]

[tools.fzf]
version = "latest"
os = [ "linux" ]

[tools.github-cli]
version = "latest"
os = [ "linux" ]

[tools.helix]
version = "latest"
os = [ "linux" ]

[tools.lua-language-server]
version = "latest"
os = [ "linux" ]

[tools.neovim]
version = "latest"
os = [ "linux" ]

[tools.ripgrep]
version = "latest"
os = [ "linux" ]

[tools.starship]
version = "latest"
os = [ "linux" ]

[tools.stylua]
version = "latest"
os = [ "linux" ]

[tools.zellij]
version = "latest"
os = [ "linux" ]

[tools.zoxide]
version = "latest"
os = [ "linux" ]
